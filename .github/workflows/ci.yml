name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    name: Format, vet and race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Go formatting
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n docker/entrypoint.sh
      - run: go vet ./...
      - run: go test -race ./...
      - name: Event privacy regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [secrets, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" \
            -o "dist/marvis2api-${GOOS}-${GOARCH}" ./cmd/server
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: marvis2api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/marvis2api-*
          if-no-files-found: error

  cleanup_initial_images:
    name: Remove initial image metadata containing event emails
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'qianjindexiaozu/marvis2api-panel'
    needs: [secrets, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete only this repository's initial GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/users/qianjindexiaozu/packages/container/marvis2api-panel'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              package = json.load(response)
          assert package.get('repository', {}).get('full_name') == 'qianjindexiaozu/marvis2api-panel', 'Refuse to delete an unrelated package'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method='DELETE'), timeout=30) as response:
              assert response.status == 204
          print('Initial package removed; clean images will be republished by the dependent build job.')
          PY

  docker:
    name: Build and publish image
    needs: [secrets, test, binaries, cleanup_initial_images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
      BUILDX_METADATA_PROVENANCE: disabled
    steps:
      - uses: actions/checkout@v4
      - name: Mask and redact event emails
        run: python3 .github/scripts/mask_event_emails.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build; push only on main or version tags
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: marvis2api-*
          path: dist
          merge-multiple: true
      - name: License and checksums
        run: |
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum marvis2api-* LICENSE > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
